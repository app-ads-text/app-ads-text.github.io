<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Color Blind Test: Vision Check</title>
    <meta name="description" content="Free color blind test. Check your color vision on iPhone or Android.">
    <meta property="og:title" content="Color Blind Test: Vision Check">
    <meta property="og:description" content="Free color blind test. Check your color vision on iPhone or Android.">
    <meta property="og:image" content="https://is1-ssl.mzstatic.com/image/thumb/Purple221/v4/a7/16/a9/a716a9f1-cd5a-47d4-0361-4afba6d9afff/AppIcon-0-0-1x_U007epad-0-1-85-220.png/512x512bb.png">
    <link rel="icon" href="favicon-32x32.png">
    <script>
        // Send phones straight to the right store; desktop sees the buttons below.
        (function () {
            var ua = navigator.userAgent || '';
            var ios = /iPhone|iPad|iPod/i.test(ua) || (/Macintosh/i.test(ua) && navigator.maxTouchPoints > 1);
            var android = /Android/i.test(ua);
            if (ios) window.location.replace('https://apps.apple.com/app/id6761285314');
            else if (android) window.location.replace('https://play.google.com/store/apps/details?id=com.testapps.colorblindtest');
        })();
    </script>
    <style>
        :root { --bg: #f9f9f9; --text: #222; --muted: #666; --btn: #111; --btn-text: #fff; }
        @media (prefers-color-scheme: dark) {
            :root { --bg: #111; --text: #eee; --muted: #aaa; --btn: #fff; --btn-text: #111; }
        }
        html, body { margin: 0; min-height: 100%; background: var(--bg); color: var(--text); }
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Arial, sans-serif;
            display: flex; align-items: center; justify-content: center;
            min-height: 100vh; padding: 0 16px; box-sizing: border-box; text-align: center;
        }
        .icon { width: 120px; height: 120px; border-radius: 26px; box-shadow: 0 4px 15px rgba(0,0,0,0.15); }
        h1 { font-size: 26px; margin: 20px 0 8px; }
        p { color: var(--muted); margin: 0 0 28px; }
        .buttons { display: flex; flex-direction: column; gap: 12px; max-width: 280px; margin: 0 auto; }
        .btn {
            display: block; padding: 14px 20px; border-radius: 12px;
            background: var(--btn); color: var(--btn-text);
            font-weight: 600; font-size: 16px; text-decoration: none;
        }
        .btn:hover { opacity: 0.85; }
        footer { margin-top: 36px; font-size: 13px; }
        footer a { color: var(--muted); }
    </style>
</head>
<body>
    <main>
        <img class="icon" src="https://is1-ssl.mzstatic.com/image/thumb/Purple221/v4/a7/16/a9/a716a9f1-cd5a-47d4-0361-4afba6d9afff/AppIcon-0-0-1x_U007epad-0-1-85-220.png/146x0w.png" alt="Color Blind Test app icon">
        <h1>Color Blind Test: Vision Check</h1>
        <p>Check your color vision for free.</p>
        <div class="buttons">
            <a class="btn" href="https://apps.apple.com/app/id6761285314">Download on the App Store</a>
            <a class="btn" href="https://play.google.com/store/apps/details?id=com.testapps.colorblindtest">Get it on Google Play</a>
        </div>
        <footer><a href="privacy.html">Privacy</a> · <a href="terms.html">Terms</a> · <a href="support.html">Support</a></footer>
    </main>
</body>
</html>
